<svg xmlns="http://www.w3.org/2000/svg" width="860" height="785" viewBox="0 0 860 785" role="img" aria-labelledby="title"><title id="title">Qwen3 block shape flow and residual path for two suffix tokens</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52647b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="38" font-size="25" font-weight="700" fill="#18283d" text-anchor="start">One Qwen3 block: two rows stay two rows</text><text x="28" y="70" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">Illustrative shape fixture · TP 1 · hidden 256 · 4 Q heads / 2 KV heads</text><rect x="180" y="100" width="480" height="68" rx="10" fill="#e8f1ff" stroke="#b6c4d4"/><text x="196" y="130" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">Token embeddings</text><text x="196" y="158" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">[2] → [2, 256]</text><rect x="130" y="190" width="580" height="440" rx="14" fill="#fafbfd" stroke="#bac5d3" stroke-dasharray="6 4"/><text x="150" y="218" font-size="18" font-weight="600" fill="#18283d" text-anchor="start">× 2 decoder layers</text><path d="M420,168 L420,235" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="235" width="480" height="65" rx="10" fill="#e8f1ff" stroke="#b6c4d4"/><text x="196" y="265" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">RMSNorm → merged QKV</text><text x="196" y="293" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">[2, 256] → [2, 512]</text><path d="M420,300 L420,325" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="325" width="480" height="75" rx="10" fill="#e2f5ec" stroke="#b6c4d4"/><text x="196" y="355" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">Q/K norm + RoPE → attention</text><text x="196" y="383" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">Q [2, 4, 64] · K/V each [2, 2, 64]</text><path d="M420,400 L420,425" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="425" width="480" height="65" rx="10" fill="#e8f1ff" stroke="#b6c4d4"/><text x="196" y="455" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">Output projection → add residual</text><text x="196" y="483" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">[2, 256] + [2, 256]</text><path d="M420,490 L420,515" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="515" width="480" height="85" rx="10" fill="#e8f1ff" stroke="#b6c4d4"/><text x="196" y="545" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">RMSNorm → gated MLP</text><text x="196" y="573" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">[2, 256] → [2, 1024] → [2, 512] → [2, 256]</text><path d="M180,130 H90 V455 H177" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="318" font-size="17" font-weight="400" fill="#18283d" text-anchor="start">residual</text><path d="M660,455 H750 V685 H663" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><text x="692" y="632" font-size="17" font-weight="400" fill="#18283d" text-anchor="start">residual</text><path d="M420,600 L420,650" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="650" width="480" height="70" rx="10" fill="#fff2d9" stroke="#b6c4d4"/><text x="196" y="680" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">Final add + RMSNorm → last row → LM head</text><text x="196" y="708" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">[2, 256] → [1, 256] → logits [1, 64]</text><text x="28" y="758" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">MLP residual addition is fused into the following norm (or the final norm).</text></g></svg>