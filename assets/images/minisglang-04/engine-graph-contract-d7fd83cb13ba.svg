<svg xmlns="http://www.w3.org/2000/svg" width="860" height="510" viewBox="0 0 860 510" role="img" aria-labelledby="title"><title id="title">Decode graph padding, persistent buffers and sampling outside graph replay</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52647b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="38" font-size="24" font-weight="700" fill="#18283d" text-anchor="start">CUDA graphs reuse work; token and cache inputs change</text><text x="28" y="70" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">Decode only · illustrative capture buckets [1, 2, 4, 8]</text><rect x="28" y="105" width="375" height="90" rx="10" fill="#e8f1ff" stroke="#b6c4d4"/><text x="44" y="135" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">This scheduling turn</text><text x="44" y="163" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">3 real requests → pad to bucket 4</text><rect x="455" y="105" width="375" height="90" rx="10" fill="#e2f5ec" stroke="#b6c4d4"/><text x="471" y="135" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">Persistent GPU input buffers</text><text x="471" y="163" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">input_ids · positions · out_loc</text><path d="M403,150 L455,150" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><rect x="455" y="225" width="375" height="90" rx="10" fill="#e2f5ec" stroke="#b6c4d4"/><text x="471" y="255" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">Backend replay preparation</text><text x="471" y="283" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">Update lengths and cache addresses</text><path d="M642,195 L642,225" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><rect x="455" y="345" width="375" height="90" rx="10" fill="#e8f1ff" stroke="#b6c4d4"/><text x="471" y="375" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">Replay captured model forward</text><text x="471" y="403" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">4 rows → persistent logits buffer</text><path d="M642,315 L642,345" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="345" width="375" height="90" rx="10" fill="#fff2d9" stroke="#b6c4d4"/><text x="44" y="375" font-size="20" font-weight="600" fill="#18283d" text-anchor="start">After replay: sampler</text><text x="44" y="403" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">Keep 3 real rows → 3 next-token IDs</text><path d="M455,390 L403,390" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="250" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">The dummy row uses a reserved</text><text x="28" y="277" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">request row and dummy cache page.</text><text x="28" y="480" font-size="18" font-weight="400" fill="#18283d" text-anchor="start">Sampling, scheduling and CPU result handling stay outside the captured model.</text></g></svg>