<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Mini-SGLang text worker prompt and token-return paths</title>
  <desc id="desc">Two message paths enter the same text worker. A frontend TokenizeMsg becomes UserMsg for scheduler rank zero. A scheduler DetokenizeMsg becomes UserReply for the frontend. Each message includes a uid so it can return to the correct client.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#31465a"/></marker><style>.b{stroke:#31465a;stroke-width:2.2;rx:15}.t{fill:#132238;font:600 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.l{fill:#132238;font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.s{fill:#4c6074;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}.m{fill:#31465a;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;text-anchor:middle}.e{fill:none;stroke:#31465a;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="560" fill="#f8fbff"/><text x="800" y="42" class="t">One text worker, two message transformations</text>
  <text x="92" y="104" fill="#bd6417" font-family="sans-serif" font-size="17" font-weight="600">Prompt path: text → token IDs</text>
  <rect x="70" y="132" width="220" height="115" class="b" fill="#e8f1ff"/><text x="180" y="167" class="l">Frontend</text><text x="180" y="194" class="m">TokenizeMsg</text><text x="180" y="215" class="m">uid, text, params</text>
  <rect x="453" y="120" width="300" height="140" class="b" fill="#fff3d9"/><text x="603" y="155" class="l">Text worker PULL</text><text x="603" y="184" class="s">TokenizeManager</text><text x="603" y="207" class="s">chat template + CPU encode</text><text x="603" y="233" class="m">int32 input_ids</text>
  <rect x="1020" y="132" width="250" height="115" class="b" fill="#e4f7f0"/><text x="1145" y="167" class="l">Scheduler rank 0</text><text x="1145" y="194" class="m">UserMsg</text><text x="1145" y="215" class="m">uid, input_ids, params</text>
  <path d="M290 189 H453" class="e"/><text x="371" y="177" class="s">ZMQ PUSH → PULL</text><path d="M753 189 H1020" class="e"/><text x="887" y="177" class="s">ZMQ PUSH → PULL</text>
  <text x="92" y="337" fill="#8d72b5" font-family="sans-serif" font-size="17" font-weight="600">Return path: sampled token ID → printable text</text>
  <rect x="70" y="365" width="220" height="115" class="b" fill="#e4f7f0"/><text x="180" y="400" class="l">Scheduler rank 0</text><text x="180" y="427" class="m">DetokenizeMsg</text><text x="180" y="448" class="m">uid, next_token, finished</text>
  <rect x="453" y="353" width="300" height="140" class="b" fill="#ece7ff"/><text x="603" y="388" class="l">Same text-worker PULL</text><text x="603" y="417" class="s">DetokenizeManager</text><text x="603" y="440" class="s">per-uid incremental decode</text><text x="603" y="466" class="m">new printable suffix</text>
  <rect x="1020" y="365" width="250" height="115" class="b" fill="#e8f1ff"/><text x="1145" y="400" class="l">Frontend listener</text><text x="1145" y="427" class="m">UserReply</text><text x="1145" y="448" class="m">uid, text, finished</text>
  <path d="M290 422 H453" class="e"/><text x="371" y="410" class="s">ZMQ PUSH → PULL</text><path d="M753 422 H1020" class="e"/><text x="887" y="410" class="s">ZMQ PUSH → PULL</text>
  <text x="800" y="531" class="s">With the default combined worker, both inbound arrows reach one PULL loop; message type selects the branch. The uid stays in every contract.</text>
</svg>
