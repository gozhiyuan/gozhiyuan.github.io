<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Two concurrent Mini-SGLang requests across the FastAPI frontend and tokenizer worker</title>
  <desc id="desc">Two HTTP requests enter the FastAPI process. Each route assigns a distinct user ID and sends a TokenizeMsg over a shared asynchronous ZMQ PUSH socket, then returns a StreamingResponse whose generator waits on an event. A previously started tokenizer worker process consumes the queued messages one at a time and forwards UserMsg messages to scheduler rank zero. The frontend event loop remains free to accept the second request while the worker is tokenizing the first.</desc>
  <defs>
    <marker id="navy" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31465a"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bd6417"/></marker>
    <style>
      .title { fill:#132238; font:600 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-anchor:middle; }
      .lane { stroke:#8ba0b3; stroke-width:2; stroke-dasharray:8 7; rx:16; }
      .box { stroke:#31465a; stroke-width:2; rx:12; }
      .label { fill:#132238; font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-anchor:middle; }
      .small { fill:#4c6074; font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-anchor:middle; }
      .note { fill:#4c6074; font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .edge { fill:none; stroke:#31465a; stroke-width:2.4; marker-end:url(#navy); }
      .edge-orange { fill:none; stroke:#bd6417; stroke-width:2.6; marker-end:url(#orange); }
      .dash { fill:none; stroke:#6f8599; stroke-width:2; stroke-dasharray:6 5; marker-end:url(#navy); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#f8fbff"/>
  <text x="800" y="43" class="title">Two requests: async frontend work, one already-running tokenizer worker</text>

  <rect x="34" y="78" width="1532" height="180" class="lane" fill="#eef5ff"/>
  <text x="62" y="110" class="note" font-weight="600">Frontend parent process — one asyncio event loop; Uvicorn can interleave many request coroutines</text>
  <rect x="78" y="139" width="190" height="78" class="box" fill="#e8f1ff"/>
  <text x="173" y="170" class="label">Request A</text><text x="173" y="195" class="small">HTTP prompt A</text>
  <rect x="322" y="139" width="230" height="78" class="box" fill="#e4f7f0"/>
  <text x="437" y="170" class="label">FastAPI route A</text><text x="437" y="195" class="small">uid=42; await send_one()</text>
  <rect x="618" y="123" width="262" height="110" class="box" fill="#fff3d9"/>
  <text x="749" y="156" class="label">shared async ZMQ PUSH</text><text x="749" y="181" class="small">queue: TokenizeMsg(42)</text><text x="749" y="204" class="small">then TokenizeMsg(43)</text>
  <rect x="951" y="139" width="248" height="78" class="box" fill="#e8f1ff"/>
  <text x="1075" y="170" class="label">stream A waits</text><text x="1075" y="195" class="small">await event_map[42].wait()</text>
  <path d="M268 178 H322" class="edge"/><path d="M552 178 H618" class="edge"/>
  <text x="586" y="160" class="small" fill="#a85716">send completes</text>
  <path d="M552 217 V245 H1075 V217" class="dash"/>

  <rect x="78" y="266" width="190" height="78" class="box" fill="#e8f1ff"/>
  <text x="173" y="297" class="label">Request B</text><text x="173" y="322" class="small">HTTP prompt B</text>
  <rect x="322" y="266" width="230" height="78" class="box" fill="#e4f7f0"/>
  <text x="437" y="297" class="label">FastAPI route B</text><text x="437" y="322" class="small">uid=43; await send_one()</text>
  <rect x="951" y="266" width="248" height="78" class="box" fill="#e8f1ff"/>
  <text x="1075" y="297" class="label">stream B waits</text><text x="1075" y="322" class="small">await event_map[43].wait()</text>
  <path d="M268 305 H322" class="edge"/><path d="M552 305 H585 V245 H749 V233" class="edge"/>
  <path d="M552 344 V365 H1075 V344" class="dash"/>
  <text x="1260" y="230" class="note">Neither waiting stream blocks the event loop.</text>

  <rect x="34" y="411" width="1532" height="206" class="lane" fill="#fffaf0"/>
  <text x="62" y="443" class="note" font-weight="600">Tokenizer worker child process — spawned during server startup, before any HTTP request</text>
  <rect x="120" y="480" width="260" height="92" class="box" fill="#fff3d9"/>
  <text x="250" y="512" class="label">blocking ZMQ PULL</text><text x="250" y="537" class="small">recv TokenizeMsg(42)</text><text x="250" y="558" class="small">then recv TokenizeMsg(43)</text>
  <rect x="510" y="480" width="260" height="92" class="box" fill="#ece7ff"/>
  <text x="640" y="512" class="label">CPU tokenizer</text><text x="640" y="537" class="small">A → token IDs</text><text x="640" y="558" class="small">then B → token IDs</text>
  <rect x="900" y="480" width="260" height="92" class="box" fill="#e4f7f0"/>
  <text x="1030" y="512" class="label">sync ZMQ PUSH</text><text x="1030" y="537" class="small">UserMsg(uid=42)</text><text x="1030" y="558" class="small">then UserMsg(uid=43)</text>
  <rect x="1275" y="480" width="208" height="92" class="box" fill="#e8f1ff"/>
  <text x="1379" y="512" class="label">Scheduler rank 0</text><text x="1379" y="537" class="small">receives both</text><text x="1379" y="558" class="small">later runs batches</text>
  <path d="M380 526 H510" class="edge-orange"/><path d="M770 526 H900" class="edge-orange"/><path d="M1160 526 H1275" class="edge-orange"/>

  <path d="M749 233 V389 H250 V480" class="edge-orange"/>
  <text x="499" y="376" class="small" fill="#a85716">one shared IPC queue</text>

  <rect x="34" y="658" width="1532" height="62" rx="14" fill="#eef3f7" stroke="#c7d5e1"/>
  <text x="800" y="684" class="small">The frontend's async wait yields its event loop, so request B can enter while the separate worker tokenizes request A. With default local_bs=1, the tokenizer loop processes queued inputs sequentially.</text>
  <text x="800" y="708" class="small">The GPU engine is not on this path yet: it begins only after scheduler rank 0 receives UserMsg. Replies take the reverse route later.</text>
</svg>
