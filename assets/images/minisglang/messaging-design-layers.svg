<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Mini-SGLang messaging design: ZMQ pipeline and frontend reply bridge</title>
  <desc id="desc">The upper half shows a brokerless ZMQ PUSH/PULL pipeline from the frontend through tokenizer, scheduler and detokenizer back to a frontend listener. Scheduler rank zero publishes messages to tensor-parallel peers. The lower half shows the listener routing a UserReply into a per-request list and Event, which wakes the SSE generator.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bd6417"/></marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31465a"/></marker>
    <style>
      .box { stroke:#31465a; stroke-width:2.2; rx:16; }
      .group { fill:none; stroke:#8ba0b3; stroke-width:2; stroke-dasharray:8 7; rx:20; }
      .title { fill:#132238; font:600 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-anchor:middle; }
      .section { fill:#31465a; font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .label { fill:#132238; font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-anchor:middle; }
      .small { fill:#4c6074; font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-anchor:middle; }
      .mono { fill:#31465a; font:13px ui-monospace,SFMono-Regular,Menlo,monospace; text-anchor:middle; }
      .edge { fill:none; stroke:#bd6417; stroke-width:2.8; marker-end:url(#arrow); }
      .edge-dark { fill:none; stroke:#31465a; stroke-width:2.4; marker-end:url(#arrow-dark); }
      .edge-dash { fill:none; stroke:#5d86b5; stroke-width:2.2; stroke-dasharray:7 5; marker-end:url(#arrow-dark); }
    </style>
  </defs>
  <rect width="1600" height="780" fill="#f8fbff"/>
  <text x="800" y="43" class="title">Mini-SGLang: one transport pipeline, one frontend reply bridge</text>
  <text x="55" y="88" class="section">1. Between processes: brokerless ZMQ message pipeline</text>
  <rect x="42" y="110" width="1516" height="255" class="group"/>
  <rect x="70" y="153" width="228" height="145" class="box" fill="#e8f1ff"/>
  <text x="184" y="188" class="label">Frontend route</text><text x="184" y="215" class="small">FastAPI +</text><text x="184" y="236" class="small">FrontendManager</text><text x="184" y="272" class="mono">PUSH request</text>
  <rect x="365" y="153" width="228" height="145" class="box" fill="#fff3d9"/>
  <text x="479" y="188" class="label">Tokenizer worker(s)</text><text x="479" y="215" class="small">PULL one prompt</text><text x="479" y="236" class="small">CPU text → IDs</text><text x="479" y="272" class="mono">PUSH UserMsg</text>
  <rect x="655" y="126" width="374" height="205" class="group"/>
  <text x="679" y="151" fill="#4c6074" font-family="sans-serif" font-size="14" font-weight="600">tensor-parallel scheduler group</text>
  <rect x="682" y="177" width="152" height="110" class="box" fill="#e4f7f0"/>
  <text x="758" y="208" class="label">rank 0</text><text x="758" y="233" class="small">PULL + schedule</text><text x="758" y="258" class="mono">PUSH token ID</text>
  <rect x="865" y="248" width="135" height="58" class="box" fill="#e7f1ff"/>
  <text x="932" y="272" class="label">rank 1…</text><text x="932" y="293" class="mono">SUB message</text>
  <rect x="1093" y="153" width="198" height="145" class="box" fill="#ece7ff"/>
  <text x="1192" y="188" class="label">Detokenizer</text><text x="1192" y="215" class="small">PULL token ID</text><text x="1192" y="236" class="small">IDs → text fragment</text><text x="1192" y="272" class="mono">PUSH UserReply</text>
  <rect x="1355" y="153" width="174" height="145" class="box" fill="#e8f1ff"/>
  <text x="1442" y="188" class="label">Frontend listener</text><text x="1442" y="215" class="small">PULL reply</text><text x="1442" y="236" class="small">route by `uid`</text><text x="1442" y="272" class="mono">UserReply(42)</text>
  <path d="M298 226 H365" class="edge"/><text x="331" y="211" class="mono">TokenizeMsg</text>
  <path d="M593 226 H682" class="edge"/><text x="637" y="211" class="mono">UserMsg</text>
  <path d="M834 226 H1093" class="edge"/><text x="963" y="211" class="mono">DetokenizeMsg</text>
  <path d="M1291 226 H1355" class="edge"/><text x="1323" y="211" class="mono">UserReply</text>
  <path d="M834 196 C850 196,850 276,865 276" class="edge-dash"/><text x="850" y="185" class="mono">PUB</text>
  <text x="800" y="343" class="small">Each arrow is an independent local IPC connection. `uid=42` stays inside the messages; no worker holds the client's HTTP connection.</text>
  <text x="55" y="419" class="section">2. Inside the frontend: deliver one returned reply to its waiting SSE stream</text>
  <rect x="42" y="442" width="1516" height="286" rx="20" fill="#eef3f7" stroke="#c6d3df" stroke-width="1.5"/>
  <rect x="95" y="514" width="250" height="135" class="box" fill="#e8f1ff"/>
  <text x="220" y="549" class="label">ZMQ listener</text><text x="220" y="576" class="mono">UserReply(uid=42,</text><text x="220" y="597" class="mono">text=&quot; hello&quot;)</text><text x="220" y="626" class="small">one task receives all replies</text>
  <rect x="454" y="514" width="263" height="135" class="box" fill="#fff3d9"/>
  <text x="585" y="549" class="label">Mailbox</text><text x="585" y="578" class="mono">ack_map[42] =</text><text x="585" y="599" class="mono">[&quot; hello&quot;]</text><text x="585" y="626" class="small">preserves reply data</text>
  <rect x="826" y="514" width="263" height="135" class="box" fill="#e4f7f0"/>
  <text x="957" y="549" class="label">Doorbell</text><text x="957" y="578" class="mono">event_map[42].set()</text><text x="957" y="606" class="small">wakes the sleeping coroutine</text>
  <rect x="1198" y="514" width="295" height="135" class="box" fill="#ece7ff"/>
  <text x="1345" y="549" class="label">SSE generator</text><text x="1345" y="578" class="mono">await event.wait()</text><text x="1345" y="599" class="mono">yield data: &quot; hello&quot;</text><text x="1345" y="626" class="small">then waits for the next token</text>
  <path d="M345 581 H454" class="edge-dark"/><text x="399" y="567" class="small">append</text>
  <path d="M717 581 H826" class="edge-dark"/><text x="772" y="567" class="small">set</text>
  <path d="M1089 581 H1198" class="edge-dark"/><text x="1143" y="567" class="small">wake + drain</text>
  <text x="800" y="691" class="small">The list and Event are application state, not ZMQ objects and not GPU scheduling queues.</text>
</svg>
