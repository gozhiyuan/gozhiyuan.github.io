<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Tensor-parallel forward pass in nano-vLLM</title><desc id="desc">Two GPU ranks receive replicated token ids and positions. They perform local embedding lookup and synchronize with all reduce, then local attention and MLP shards with all reduce boundaries, and gather vocabulary logits at rank zero.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17243a}.title{font-size:22px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#42526b}.box{stroke-width:2}.arr{stroke:#63718b;stroke-width:2.5;fill:none;marker-end:url(#h)}.collective{fill:#f8dfac;stroke:#c47b11;stroke-width:2}.local{fill:#e9f2ff;stroke:#4f7bd9;stroke-width:2}.input{fill:#e8f8ed;stroke:#3f9861;stroke-width:2}</style><marker id="h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#63718b"/></marker></defs>
  <rect width="1200" height="670" rx="18" fill="#f8fafc"/><text x="42" y="45" class="title">One tensor-parallel forward pass: weights are sharded; control inputs and full hidden states are replicated</text>
  <text x="135" y="88" class="label">Rank 0 / GPU 0</text><text x="835" y="88" class="label">Rank 1 / GPU 1</text>
  <rect x="75" y="108" width="310" height="55" rx="10" class="input"/><rect x="815" y="108" width="310" height="55" rx="10" class="input"/><text x="105" y="142" class="label">input_ids, positions  [T]</text><text x="845" y="142" class="label">input_ids, positions  [T]</text>
  <path d="M230 164 V205" class="arr"/><path d="M970 164 V205" class="arr"/>
  <rect x="75" y="210" width="310" height="65" rx="10" class="local"/><rect x="815" y="210" width="310" height="65" rx="10" class="local"/><text x="102" y="240" class="label">local vocab embedding shard</text><text x="140" y="262" class="small">masked lookup → partial [T, H]</text><text x="842" y="240" class="label">local vocab embedding shard</text><text x="880" y="262" class="small">masked lookup → partial [T, H]</text>
  <path d="M385 242 H540" class="arr"/><path d="M815 242 H660" class="arr"/><rect x="520" y="210" width="160" height="65" rx="10" class="collective"/><text x="542" y="240" class="label">ALL-REDUCE</text><text x="553" y="262" class="small">both get [T,H]</text>
  <path d="M230 276 V322" class="arr"/><path d="M970 276 V322" class="arr"/>
  <rect x="75" y="328" width="310" height="80" rx="10" class="local"/><rect x="815" y="328" width="310" height="80" rx="10" class="local"/><text x="105" y="358" class="label">local QKV heads + attention</text><text x="104" y="383" class="small">local K/V cache; no QKV collective</text><text x="845" y="358" class="label">local QKV heads + attention</text><text x="844" y="383" class="small">local K/V cache; no QKV collective</text>
  <path d="M385 368 H540" class="arr"/><path d="M815 368 H660" class="arr"/><rect x="520" y="336" width="160" height="65" rx="10" class="collective"/><text x="542" y="366" class="label">ALL-REDUCE</text><text x="534" y="388" class="small">after row O projection</text>
  <path d="M230 408 V453" class="arr"/><path d="M970 408 V453" class="arr"/>
  <rect x="75" y="458" width="310" height="80" rx="10" class="local"/><rect x="815" y="458" width="310" height="80" rx="10" class="local"/><text x="106" y="489" class="label">local SwiGLU MLP slice</text><text x="106" y="514" class="small">column gate/up → local → row down</text><text x="846" y="489" class="label">local SwiGLU MLP slice</text><text x="846" y="514" class="small">column gate/up → local → row down</text>
  <path d="M385 498 H540" class="arr"/><path d="M815 498 H660" class="arr"/><rect x="520" y="466" width="160" height="65" rx="10" class="collective"/><text x="542" y="496" class="label">ALL-REDUCE</text><text x="540" y="518" class="small">both get [T,H]</text>
  <path d="M230 538 V577" class="arr"/><path d="M970 538 V577" class="arr"/>
  <rect x="75" y="582" width="310" height="53" rx="10" class="local"/><rect x="815" y="582" width="310" height="53" rx="10" class="local"/><text x="107" y="615" class="label">vocab-logit shard [B,V/2]</text><text x="847" y="615" class="label">vocab-logit shard [B,V/2]</text>
  <path d="M815 609 H410" class="arr"/><rect x="420" y="575" width="310" height="67" rx="10" class="collective"/><text x="470" y="604" class="label">GATHER TO RANK 0 → concat [B,V]</text><text x="488" y="626" class="small">rank 0 samples next token IDs</text>
</svg>
