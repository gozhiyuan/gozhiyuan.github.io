<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc">
  <title id="title">Detailed nano-vLLM end-to-end architecture and data flow</title>
  <desc id="desc">A layered diagram of nano-vLLM. Offline prompts become sequences in the LLM engine. The scheduler manages waiting and running deques and a BlockManager with free, used, reference-count, and hash maps. It selects prefill or decode batches. Rank zero sends a command via shared memory to worker ranks. Each rank prepares tensors, runs a Qwen3 shard, writes a local paged KV cache, performs NCCL collectives, and rank zero samples output tokens for scheduler postprocessing.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17243a}.title{font-size:24px;font-weight:700}.section{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:650}.small{font-size:12.5px;fill:#42526b}.tiny{font-size:11.5px;fill:#516078}.frame{fill:none;stroke:#75839a;stroke-width:2;stroke-dasharray:7 5}.box{stroke-width:2}.blue{fill:#eaf2ff;stroke:#4d79d8}.green{fill:#e8f8ed;stroke:#3c9860}.yellow{fill:#fff4da;stroke:#c38416}.purple{fill:#f3ecff;stroke:#895ec3}.gray{fill:#f7f8fb;stroke:#8491a5}.redbox{fill:#fff0ef;stroke:#c64b4b}.arr{stroke:#60708b;stroke-width:2.35;fill:none;marker-end:url(#head)}.data{stroke:#268b61;stroke-width:2.35;fill:none;marker-end:url(#greenhead)}.return{stroke:#c64b4b;stroke-width:2.35;fill:none;marker-end:url(#redhead)}.dash{stroke-dasharray:5 4}
    </style>
    <marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#60708b"/></marker>
    <marker id="greenhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#268b61"/></marker>
    <marker id="redhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#c64b4b"/></marker>
  </defs>
  <rect width="1500" height="1180" rx="18" fill="#fbfcfe"/>
  <text x="35" y="39" class="title">nano-vLLM, end to end: request state, KV-page metadata, rank control, and GPU execution</text>

  <rect x="28" y="65" width="815" height="610" rx="16" class="frame"/>
  <text x="50" y="94" class="section">1. Main CPU process: offline LLMEngine and the authoritative request state</text>
  <rect x="55" y="120" width="126" height="68" rx="9" class="gray box"/><text x="78" y="148" class="label">prompts</text><text x="67" y="170" class="small">list supplied to generate()</text>
  <rect x="220" y="120" width="135" height="68" rx="9" class="yellow box"/><text x="244" y="148" class="label">Tokenizer</text><text x="237" y="170" class="small">encode / decode</text>
  <rect x="395" y="110" width="190" height="90" rx="9" class="green box"/><text x="422" y="137" class="label">Sequence</text><text x="412" y="159" class="small">token_ids + last_token</text><text x="412" y="178" class="small">cached/scheduled counts</text><text x="412" y="196" class="small">status + block_table</text>
  <path d="M181 154 H218" class="arr"/><path d="M355 154 H393" class="data"/><text x="357" y="142" class="tiny">token IDs</text>

  <rect x="55" y="235" width="755" height="400" rx="12" class="green box"/>
  <text x="75" y="262" class="section">Scheduler: select a homogeneous prefill or decode batch</text>
  <rect x="82" y="288" width="164" height="114" rx="9" class="gray box"/><text x="108" y="316" class="label">waiting deque</text><text x="98" y="340" class="small">fresh prompts</text><text x="98" y="360" class="small">chunked prefill</text><text x="98" y="380" class="small">preempted requests</text>
  <rect x="82" y="440" width="164" height="114" rx="9" class="gray box"/><text x="108" y="468" class="label">running deque</text><text x="99" y="492" class="small">prompt complete</text><text x="99" y="512" class="small">one decode input</text><text x="99" y="532" class="small">per selected sequence</text>
  <rect x="286" y="288" width="230" height="266" rx="9" class="yellow box"/><text x="318" y="315" class="label">BlockManager metadata</text><text x="306" y="343" class="small">free_block_ids: deque[ID]</text><text x="306" y="365" class="small">used_block_ids: set[ID]</text><text x="306" y="387" class="small">blocks[ID]: {ref_count,</text><text x="306" y="405" class="small">hash, token_ids}</text><text x="306" y="431" class="small">hash_to_block_id:</text><text x="306" y="449" class="small">complete-prefix hash → ID</text><text x="306" y="484" class="tiny">CPU page table: seq.block_table</text><text x="306" y="502" class="tiny">logical block → physical cache ID</text>
  <rect x="557" y="288" width="220" height="108" rx="9" class="purple box"/><text x="588" y="315" class="label">prefill branch</text><text x="575" y="340" class="small">waiting[0], can_allocate()</text><text x="575" y="360" class="small">allocate/reuse whole pages</text><text x="575" y="380" class="small">schedule prompt slice</text>
  <rect x="557" y="430" width="220" height="124" rx="9" class="purple box"/><text x="589" y="457" class="label">decode branch</text><text x="575" y="482" class="small">popleft running sequence</text><text x="575" y="502" class="small">can_append()/may_append()</text><text x="575" y="522" class="small">preempt victim if needed</text><text x="575" y="542" class="small">schedule exactly one token</text>
  <path d="M246 345 H284" class="arr"/><path d="M246 497 H284" class="arr"/><path d="M516 343 H555" class="arr"/><path d="M516 493 H555" class="arr"/>
  <rect x="555" y="580" width="222" height="38" rx="8" class="redbox box"/><text x="573" y="605" class="label">postprocess(): hash / append / free</text>
  <path d="M467 200 V233" class="data"/><path d="M666 554 V578" class="return"/>

  <rect x="875" y="65" width="595" height="610" rx="16" class="frame"/>
  <text x="897" y="94" class="section">2. Rank control and one ModelRunner per GPU</text>
  <rect x="902" y="125" width="225" height="180" rx="10" class="blue box"/><text x="930" y="153" class="label">rank 0 / main process</text><text x="923" y="180" class="small">call("run", seqs, mode)</text><text x="923" y="201" class="small">pickle [method, seqs, mode]</text><text x="923" y="222" class="small">write 1 MiB shared memory</text><text x="923" y="243" class="small">Event.set() each worker</text><text x="923" y="274" class="tiny">also runs its own ModelRunner.run()</text>
  <rect x="1190" y="125" width="245" height="180" rx="10" class="blue box"/><text x="1220" y="153" class="label">worker ranks 1 … TP-1</text><text x="1212" y="180" class="small">Event.wait() → read_shm()</text><text x="1212" y="201" class="small">unpickle same sequence metadata</text><text x="1212" y="222" class="small">call local run(seqs, mode)</text><text x="1212" y="274" class="tiny">do not schedule or sample output IDs</text>
  <path d="M1127 191 H1188" class="arr"/><text x="1130" y="177" class="tiny">host shared memory + Events</text>
  <rect x="902" y="347" width="533" height="126" rx="10" class="gray box"/><text x="927" y="375" class="label">prepare_prefill() or prepare_decode() on every rank</text><text x="927" y="400" class="small">input_ids + positions; slot_mapping; block_tables; context lengths / cumulative sequence lengths</text><text x="927" y="422" class="small">CPU Python block_table lists become pinned host tensors, then asynchronous CUDA int32 tensors</text><text x="927" y="449" class="tiny">same logical IDs on all ranks; each rank owns different local weight/KV-head shards</text>
  <rect x="902" y="515" width="250" height="105" rx="10" class="purple box"/><text x="925" y="543" class="label">CPU control plane</text><text x="924" y="568" class="small">pickle metadata + Events</text><text x="924" y="589" class="small">no activations/KV copied here</text>
  <rect x="1183" y="515" width="252" height="105" rx="10" class="yellow box"/><text x="1207" y="543" class="label">GPU data plane</text><text x="1205" y="568" class="small">NCCL all-reduce/gather</text><text x="1205" y="589" class="small">model tensors + local cache</text>
  <path d="M1168 473 V513" class="arr"/>

  <rect x="28" y="705" width="1442" height="440" rx="16" class="frame"/>
  <text x="50" y="734" class="section">3. Per-rank GPU forward: context drives a custom Qwen3 shard and its paged K/V cache</text>
  <rect x="58" y="765" width="215" height="295" rx="10" class="green box"/><text x="89" y="793" class="label">Qwen3 model shard</text><text x="79" y="820" class="small">vocab embedding</text><text x="79" y="841" class="small">all-reduce → full [T,H]</text><text x="79" y="870" class="small">decoder layers × L:</text><text x="79" y="890" class="small">RMSNorm / local QKV</text><text x="79" y="910" class="small">RoPE / local attention</text><text x="79" y="930" class="small">row O all-reduce</text><text x="79" y="950" class="small">SwiGLU / row MLP all-reduce</text><text x="79" y="980" class="small">final norm + vocab logits</text><text x="79" y="1000" class="small">gather logits to rank 0</text><text x="79" y="1030" class="tiny">rank 0 samples; workers return None</text>
  <rect x="330" y="765" width="335" height="295" rx="10" class="purple box"/><text x="358" y="793" class="label">Attention inside each decoder layer</text><rect x="355" y="820" width="135" height="60" rx="7" class="gray box"/><text x="376" y="847" class="small">Q/K/V local</text><text x="366" y="867" class="small">head shards</text><rect x="520" y="820" width="118" height="60" rx="7" class="yellow box"/><text x="540" y="847" class="small">slot_mapping</text><text x="541" y="867" class="small">write location</text><path d="M490 850 H518" class="arr"/>
  <rect x="355" y="915" width="135" height="65" rx="7" class="blue box"/><text x="374" y="943" class="small">store_kvcache</text><text x="375" y="963" class="small">Triton kernel</text><rect x="520" y="915" width="118" height="65" rx="7" class="green box"/><text x="546" y="943" class="small">global</text><text x="538" y="963" class="small">KV cache</text><path d="M580 880 V913" class="data"/><path d="M422 880 V913" class="arr"/>
  <text x="355" y="1012" class="tiny">prefill: flash_attn_varlen_func (block table only with prefix cache)</text><text x="355" y="1032" class="tiny">decode: flash_attn_with_kvcache (block table + context lengths)</text>
  <rect x="715" y="765" width="290" height="295" rx="10" class="yellow box"/><text x="744" y="793" class="label">Per-rank KV-cache tensor</text><text x="740" y="823" class="small">[K/V, layer, physical block,</text><text x="740" y="844" class="small">token offset, local KV heads, D]</text><text x="740" y="877" class="small">allocated once after warm-up</text><text x="740" y="898" class="small">same physical ID means a page</text><text x="740" y="919" class="small">in every layer of this rank</text><text x="740" y="953" class="small">block ID released → bytes remain</text><text x="740" y="974" class="small">reusable; tensor does not shrink</text><text x="740" y="1018" class="tiny">prefix cache shares complete blocks</text>
  <path d="M638 947 H713" class="data"/>
  <rect x="1050" y="765" width="385" height="295" rx="10" class="blue box"/><text x="1078" y="793" class="label">Tensor-parallel communication across GPUs</text><text x="1075" y="826" class="small">Embedding: masked local lookup → ALL-REDUCE [T,H]</text><text x="1075" y="850" class="small">Attention: local heads/cache; O projection → ALL-REDUCE</text><text x="1075" y="874" class="small">MLP: column gate/up local; down projection → ALL-REDUCE</text><text x="1075" y="898" class="small">LM head: local vocab logits → GATHER + concat at rank 0</text><text x="1075" y="932" class="small">No collective reconstructs a full QKV tensor.</text><text x="1075" y="954" class="small">All ranks receive full hidden states at each all-reduce boundary.</text><text x="1075" y="1005" class="tiny">NCCL coordinates GPU tensors; it is distinct from host shared memory.</text>
  <path d="M1005 913 H1048" class="arr"/>
  <path d="M273 910 H328" class="data"/><path d="M1005 1016 C1120 1112 520 1112 360 1062" class="return"/><text x="640" y="1125" class="tiny">rank-0 sampled token IDs return to Scheduler.postprocess(), which appends, finishes/frees, or leaves the Sequence for its next decode step</text>
  <text x="30" y="1170" class="tiny">This diagram intentionally synthesizes the prior posts: the scheduler owns logical IDs and request state; ModelRunner turns them into tensors; attention turns tensor metadata into K/V reads/writes; the custom Qwen3 model turns those states into next-token logits.</text>
</svg>
