<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Prefill allocation and prefix-cache decision</title>
  <desc id="desc">A new sequence hashes full prefix pages, checks capacity, then shares matched pages or allocates new ones before GPU prefill and postprocess hashing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b4a5a"/></marker>
    <style>
      .box { stroke:#3b4a5a; stroke-width:2; rx:12; }
      .diamond { fill:#fff5db; stroke:#3b4a5a; stroke-width:2; }
      .t { fill:#132238; font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-anchor:middle; }
      .s { fill:#4c6074; font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-anchor:middle; }
      .e { fill:none; stroke:#3b4a5a; stroke-width:2.3; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="410" fill="#f8fbff"/>
  <text x="600" y="38" class="t" font-size="24">What happens before a fresh prompt may prefill</text>
  <rect x="40" y="164" width="160" height="72" class="box" fill="#e8f1ff"/><text x="120" y="194" class="t">waiting head</text><text x="120" y="216" class="s">new Sequence</text>
  <rect x="270" y="164" width="180" height="72" class="box" fill="#efeaff"/><text x="360" y="193" class="t">can_allocate()</text><text x="360" y="216" class="s">hash full prefix pages</text>
  <path d="M545 141 L635 200 L545 259 L455 200 Z" class="diamond"/><text x="545" y="194" class="t">enough</text><text x="545" y="215" class="t">free IDs?</text>
  <rect x="695" y="164" width="204" height="72" class="box" fill="#e4f7f0"/><text x="797" y="193" class="t">allocate()</text><text x="797" y="216" class="s">share matched + claim new</text>
  <rect x="968" y="164" width="190" height="72" class="box" fill="#e8f1ff"/><text x="1063" y="193" class="t">GPU prefill</text><text x="1063" y="216" class="s">write new K/V, hash full pages</text>
  <path d="M200 200 H270" class="e"/><path d="M450 200 H455" class="e"/><path d="M635 200 H695" class="e"/><path d="M899 200 H968" class="e"/>
  <path d="M545 259 V330 H360 V236" class="e"/><text x="470" y="321" class="s">no: leave prompt waiting</text>
  <text x="665" y="151" class="s">yes</text>
  <text x="600" y="381" class="s">A full prefix hit can point two live sequences at one ID; an incomplete last page is never a cache hit.</text>
</svg>
