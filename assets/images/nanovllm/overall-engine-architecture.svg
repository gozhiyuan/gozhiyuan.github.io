<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">nano-vLLM end-to-end engine architecture</title><desc id="desc">An end-to-end diagram of offline prompts entering LLMEngine, becoming sequences, being scheduled, then dispatched to rank zero and worker model runners. The runners prepare tensors, run per-rank Qwen3 and KV caches, synchronize tensor-parallel computation, and return sampled token ids to postprocessing.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17243a}.title{font-size:23px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#42526b}.tiny{font-size:12px;fill:#55647c}.outline{stroke-width:2;fill:none}.blue{fill:#eaf2ff;stroke:#4d79d8}.green{fill:#e8f8ed;stroke:#3c9860}.yellow{fill:#fff4da;stroke:#c38416}.purple{fill:#f2ebff;stroke:#895ec3}.gray{fill:#f7f8fb;stroke:#8390a5}.arr{stroke:#61718b;stroke-width:2.4;fill:none;marker-end:url(#h)}.data{stroke:#2b8c62;stroke-width:2.4;fill:none;marker-end:url(#hg)}.ret{stroke:#c64b4b;stroke-width:2.4;fill:none;marker-end:url(#hr)}</style><marker id="h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#61718b"/></marker><marker id="hg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#2b8c62"/></marker><marker id="hr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#c64b4b"/></marker></defs>
  <rect width="1400" height="850" rx="18" fill="#fbfcfe"/><text x="42" y="43" class="title">nano-vLLM overall architecture: offline batch generation plus rank-0 control and per-rank GPU execution</text>
  <rect x="35" y="75" width="600" height="445" rx="16" class="outline" stroke="#71809a" stroke-dasharray="7 5"/><text x="55" y="103" class="label">Main process / rank 0: LLMEngine</text>
  <rect x="65" y="130" width="155" height="74" rx="10" class="gray"/><text x="91" y="160" class="label">generate()</text><text x="83" y="184" class="small">offline prompt list</text>
  <rect x="270" y="130" width="150" height="74" rx="10" class="yellow"/><text x="294" y="160" class="label">Tokenizer</text><text x="283" y="184" class="small">encode / decode</text>
  <rect x="470" y="130" width="130" height="74" rx="10" class="green"/><text x="490" y="160" class="label">Sequence</text><text x="492" y="184" class="small">token IDs + state</text>
  <path d="M220 167 H268" class="arr"/><path d="M420 167 H468" class="data"/><text x="430" y="150" class="tiny">token IDs</text>
  <rect x="95" y="265" width="475" height="205" rx="13" class="green"/><text x="116" y="294" class="label">Scheduler + BlockManager (CPU metadata)</text>
  <rect x="122" y="320" width="150" height="105" rx="8" class="gray"/><text x="145" y="350" class="label">waiting deque</text><text x="138" y="375" class="small">prompt prefill</text><text x="138" y="399" class="small">fresh / preempted</text>
  <rect x="322" y="320" width="150" height="105" rx="8" class="gray"/><text x="345" y="350" class="label">running deque</text><text x="344" y="375" class="small">one decode token</text><text x="343" y="399" class="small">per selected seq</text>
  <rect x="492" y="320" width="55" height="105" rx="8" class="purple"/><text x="505" y="353" class="small">block</text><text x="506" y="376" class="small">IDs</text><text x="501" y="399" class="small">refs</text>
  <path d="M535 204 V263" class="data"/><text x="545" y="239" class="tiny">add(seq)</text>
  <path d="M272 372 H320" class="arr"/><path d="M472 372 H490" class="arr"/>
  <rect x="700" y="75" width="665" height="445" rx="16" class="outline" stroke="#71809a" stroke-dasharray="7 5"/><text x="720" y="103" class="label">ModelRunner processes and GPUs</text>
  <rect x="728" y="130" width="255" height="305" rx="12" class="blue"/><text x="750" y="159" class="label">Rank 0 / GPU 0</text><rect x="753" y="181" width="205" height="60" rx="8" class="gray"/><text x="772" y="207" class="label">call("run", seqs)</text><text x="789" y="228" class="small">write shared memory</text><rect x="753" y="265" width="205" height="136" rx="8" class="purple"/><text x="775" y="292" class="label">prepare → run model</text><text x="779" y="317" class="small">input IDs / positions</text><text x="779" y="340" class="small">context + block tables</text><text x="779" y="364" class="small">rank-0 logits + sampler</text>
  <rect x="1043" y="130" width="285" height="305" rx="12" class="blue"/><text x="1065" y="159" class="label">Worker rank 1 … rank N</text><rect x="1070" y="181" width="230" height="60" rx="8" class="gray"/><text x="1085" y="207" class="label">Event.wait() / read_shm()</text><text x="1094" y="228" class="small">same seq metadata</text><rect x="1070" y="265" width="230" height="136" rx="8" class="purple"/><text x="1091" y="292" class="label">prepare → run model</text><text x="1093" y="317" class="small">local weight + KV shard</text><text x="1093" y="340" class="small">NCCL tensor-parallel work</text><text x="1093" y="364" class="small">returns no token IDs</text>
  <path d="M958 210 H1068" class="arr"/><text x="976" y="194" class="tiny">Event signal</text><path d="M958 232 H1068" class="arr"/><text x="972" y="256" class="tiny">shared-memory payload</text>
  <path d="M570 365 H726" class="data"/><text x="608" y="348" class="tiny">scheduled seqs + is_prefill</text><path d="M728 420 C650 480 590 472 475 470" class="ret"/><text x="540" y="493" class="tiny">rank-0 sampled token IDs</text>
  <rect x="75" y="575" width="1250" height="225" rx="16" class="outline" stroke="#71809a" stroke-dasharray="7 5"/><text x="95" y="604" class="label">One GPU forward call inside every rank</text>
  <rect x="105" y="635" width="160" height="105" rx="10" class="green"/><text x="126" y="664" class="label">Qwen3 model</text><text x="126" y="689" class="small">vocab embedding</text><text x="126" y="713" class="small">decoder layers × L</text>
  <rect x="330" y="635" width="245" height="105" rx="10" class="purple"/><text x="355" y="663" class="label">Attention per layer</text><text x="355" y="688" class="small">write K/V via slot_mapping</text><text x="355" y="712" class="small">prefill or decode FlashAttention</text>
  <rect x="640" y="635" width="190" height="105" rx="10" class="yellow"/><text x="665" y="663" class="label">KV-cache shard</text><text x="665" y="688" class="small">[K/V, layer, block,</text><text x="665" y="712" class="small">offset, local KV head, D]</text>
  <rect x="900" y="635" width="180" height="105" rx="10" class="blue"/><text x="928" y="663" class="label">TP collectives</text><text x="926" y="688" class="small">all-reduce hidden</text><text x="926" y="712" class="small">gather logits → rank 0</text>
  <rect x="1140" y="635" width="145" height="105" rx="10" class="green"/><text x="1166" y="663" class="label">Sampler</text><text x="1157" y="688" class="small">rank 0 only</text><text x="1157" y="712" class="small">next token IDs</text>
  <path d="M265 688 H328" class="arr"/><path d="M575 688 H638" class="data"/><path d="M830 688 H898" class="arr"/><path d="M1080 688 H1138" class="arr"/>
  <text x="75" y="830" class="tiny">Green arrows carry request/model data; red arrows return sampled IDs to CPU postprocessing. CPU shared memory/Event coordinates worker control; NCCL collectives coordinate GPU tensor-parallel math.</text>
</svg>
