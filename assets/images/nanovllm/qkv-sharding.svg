<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">QKV column parallelism and output row parallelism</title><desc id="desc">A toy two-rank transformer attention layer with four query heads, two key value heads, head dimension two, and hidden size eight. Both ranks use a full hidden-state input, calculate their own QKV heads, then all reduce row-projection contributions.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17243a}.title{font-size:21px;font-weight:700}.label{font-size:15px;font-weight:650}.small{font-size:13px;fill:#42526b}.arr{stroke:#65728b;stroke-width:2.5;fill:none;marker-end:url(#h)}.box{stroke-width:2}</style><marker id="h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#65728b"/></marker></defs>
  <rect width="1200" height="480" rx="18" fill="#f8fafc"/><text x="40" y="44" class="title">Toy attention layer, TP = 2: H = 8, Q heads = 4, KV heads = 2, head dimension = 2</text>
  <rect x="50" y="105" width="210" height="80" rx="12" fill="#e8f8ed" stroke="#3f9861" class="box"/><text x="83" y="139" class="label">full hidden states</text><text x="84" y="164" class="small">each rank receives [T, 8]</text>
  <path d="M260 145 H345" class="arr"/><path d="M260 145 C330 145 300 325 345 325" class="arr"/>
  <rect x="355" y="80" width="300" height="130" rx="12" fill="#eaf2ff" stroke="#4f7bd9" class="box"/><text x="382" y="115" class="label">Rank 0: QKV column shard</text><text x="382" y="145" class="small">Q0,Q1  → [T, 2 heads, 2]</text><text x="382" y="170" class="small">K0,V0  → [T, 1 head, 2]</text><text x="382" y="194" class="small">local fused qkv width = 8</text>
  <rect x="355" y="270" width="300" height="130" rx="12" fill="#eaf2ff" stroke="#4f7bd9" class="box"/><text x="382" y="305" class="label">Rank 1: QKV column shard</text><text x="382" y="335" class="small">Q2,Q3  → [T, 2 heads, 2]</text><text x="382" y="360" class="small">K1,V1  → [T, 1 head, 2]</text><text x="382" y="384" class="small">local fused qkv width = 8</text>
  <path d="M655 145 H748" class="arr"/><path d="M655 335 H748" class="arr"/>
  <rect x="758" y="80" width="210" height="130" rx="12" fill="#f2ebff" stroke="#865ac4" class="box"/><text x="786" y="115" class="label">local attention</text><text x="786" y="145" class="small">local Q/K/V cache</text><text x="786" y="170" class="small">output [T, 4]</text><text x="786" y="194" class="small">two local Q heads</text>
  <rect x="758" y="270" width="210" height="130" rx="12" fill="#f2ebff" stroke="#865ac4" class="box"/><text x="786" y="305" class="label">local attention</text><text x="786" y="335" class="small">local Q/K/V cache</text><text x="786" y="360" class="small">output [T, 4]</text><text x="786" y="384" class="small">two local Q heads</text>
  <path d="M968 145 H1030" class="arr"/><path d="M968 335 H1030" class="arr"/>
  <rect x="1040" y="150" width="125" height="160" rx="12" fill="#fff4d8" stroke="#c47b11" class="box"/><text x="1063" y="187" class="label">row O</text><text x="1055" y="214" class="small">each computes</text><text x="1052" y="236" class="small">[T,8] partial</text><text x="1055" y="268" class="label">ALL-REDUCE</text><text x="1050" y="292" class="small">both receive [T,8]</text>
  <text x="51" y="450" class="small">The collective sums output-projection contributions; it does not exchange or reconstruct a full QKV tensor. The next RMSNorm and MLP therefore begin from replicated [T,H] hidden states.</text>
</svg>
